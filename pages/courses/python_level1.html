<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Python Level 1 – Project Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white font-sans">
  <!-- Navbar -->
  <header class="bg-black/50 backdrop-blur-lg fixed top-0 left-0 w-full z-10 border-b border-white/10">
    <nav class="flex justify-between items-center px-8 py-4 text-lg font-medium">
      <h1 class="text-2xl font-bold text-blue-400">Project Hub</h1>
      <div class="space-x-6">
        <a href="python.html" class="hover:text-blue-400 transition">← Back</a>
      </div>
    </nav>
  </header>

  <main class="pt-32 px-8 max-w-4xl mx-auto text-center">
    <h2 class="text-4xl font-bold mb-6 text-green-400">Python Level 1: Basics</h2>
    <p class="text-gray-300 mb-6">Write Python code to solve the challenge. Correct answers earn points!</p>

    <!-- Challenge -->
    <div class="bg-gray-800 p-6 rounded-2xl mb-8">
      <h3 class="text-xl font-semibold mb-4">Challenge: Print "Hello World"</h3>
      <textarea id="codeInput" class="w-full h-40 p-3 rounded-lg bg-gray-900 text-white font-mono" placeholder="Write your Python code here..."></textarea>
      <button onclick="checkCode()" class="mt-4 bg-blue-500 hover:bg-blue-600 px-6 py-2 rounded-lg">Submit</button>
      <p id="feedback" class="mt-4 text-lg"></p>
    </div>
  </main>

  <footer class="bg-black/60 text-center py-6 mt-20 border-t border-white/10">
    <small class="text-gray-400">&copy; 2025 Project Hub. Special thanks to Mr. Esen.</small>
  </footer>

  <script>
    function checkCode() {
      const code = document.getElementById("codeInput").value.toLowerCase();
      const feedback = document.getElementById("feedback");
      if (code.includes('print("hello world")') || code.includes("print('hello world')")) {
        feedback.textContent = "✅ Correct! You completed Level 1!";
        feedback.className = "mt-4 text-lg text-green-400 font-semibold";
      } else {
        feedback.textContent = "❌ Try again! Make sure to print 'Hello World'.";
        feedback.className = "mt-4 text-lg text-red-400 font-semibold";
      }
    }
  </script>
</body>
</html>
